# ========================================
# HELPER QUERIES - Get IDs for testing
# ========================================

# Get all operators to find IDs
query GetOperators {
  operators {
    id
    firstName
    lastName
    category
  }
}

# Get all services to find IDs
query GetServices {
  services {
    id
    name
    defaultDuration
    instrumentOrderMatters
    defaultInstrumentSlotOffset
    reverseInstrumentOrder
    requiredInstruments {
      id
      instrumentCategory {
        id
        name
      }
      quantity
    }
  }
}

# Get all instrument categories to find IDs
query GetInstrumentCategories {
  instrumentCategories {
    id
    name
    instruments {
      id
      name
      isActive
    }
  }
}

# Get all gym rooms to find IDs
query GetGymRooms {
  gymRooms {
    id
    name
    capacity
  }
}
