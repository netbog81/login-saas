# ----------------------------------------
# 8. TEST: Gym room availability
# ----------------------------------------
# This tests gym room capacity-based availability
query TestGymAvailability {
  gymAvailableSlots(
    gymRoomId: "your-gym-room-uuid-here"
    date: "2025-11-26"
  ) {
    startTime
    endTime
    availableCapacity
    totalCapacity
    operatorName
  }
}

