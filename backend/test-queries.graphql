# ========================================
# TEST QUERIES FOR AVAILABILITY SYSTEM
# ========================================

# ----------------------------------------
# 1. TEST: Physiotherapist slots with PRE-CONFIGURED SERVICE
# ----------------------------------------
# This tests the logic using service configuration from database
# Replace UUIDs with actual values from your database
query TestPhysiotherapistWithService {
  physiotherapistAvailableSlots(input: {
    operatorId: "your-operator-uuid-here"
    date: "2025-11-26"
    serviceId: "your-service-uuid-here"
  }) {
    startTime
    endTime
    available
    reason
    suggestedInstruments {
      instrumentCategoryId
      categoryName
      instrumentId
      instrumentName
      startOffsetMinutes
      endOffsetMinutes
    }
  }
}

# ----------------------------------------
# 2. TEST: Physiotherapist slots with CUSTOM PARAMETERS (30 min, 1 instrument)
# ----------------------------------------
# This tests custom service parameters without using pre-configured service
query TestPhysiotherapistCustom30Min {
  physiotherapistAvailableSlots(input: {
    operatorId: "your-operator-uuid-here"
    date: "2025-11-26"
    durationMinutes: 30
    customInstrumentSlots: [
      {
        instrumentCategoryId: "your-category-uuid-here"
        startOffsetMinutes: 0
        endOffsetMinutes: 30
      }
    ]
  }) {
    startTime
    endTime
    available
    reason
    suggestedInstruments {
      instrumentCategoryId
      categoryName
      instrumentId
      instrumentName
      startOffsetMinutes
      endOffsetMinutes
    }
  }
}

