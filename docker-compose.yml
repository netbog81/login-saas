# Curandis Clinico — backend NestJS + frontend Angular dietro nginx.
#
# Containerizzato il 2026-06-11 a partire dal vecchio modulo login-saas
# (schema-per-tenant + nest start locale) → architettura DB-per-tenant
# allineata a registry/accounting:
#   - DB-per-tenant via OpenBao KV `tenant-clinico-db/<alias>`
#   - Static-cred Postgres rotated 24h `postgres-clinico_<alias>_svc`
#   - RabbitMQ creds da KV `clinico/rabbitmq`
#   - Keycloak service-account / admin da KV `keycloak/*`
#   - Whatsapp encryption key da KV `whatsapp/*`
#
# OpenBao Agent gira sull'host (porta 8203) con sink token in
# /run/openbao-agent-clinico/clinico-token (perm 0640 root:openbao-agent).
# Il backend container monta quella dir read-only e gira come membro
# del gruppo openbao-agent (vedi build-arg OPENBAO_AGENT_GID nel Dockerfile).
#
# Network curandis_network è esterno (lo crea curandis-common-services con
# RabbitMQ e Redis condivisi). Network evolution_net è esterno (gateway
# 172.19.0.1 per raggiungere openbao-agent-clinico sull'host).
#
# Vars principali in .env (vedi .env.docker.example):
#   OPENBAO_AGENT_GID, KEYCLOAK_URL, REGISTRY_BASE_URL_PATTERN, ...

services:
  clinico-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Credenziale di sola lettura per il package registry GitLab, da cui
      # arrivano le @curandis/*. Montata solo durante `npm ci`, non finisce in
      # nessun layer. Vedi la sezione secrets in fondo.
      secrets:
        - npmrc
      args:
        OPENBAO_AGENT_GID: ${OPENBAO_AGENT_GID:-986}
    image: curandis/clinico-backend:latest
    container_name: curandis-clinico-backend
    restart: unless-stopped
    environment:
      # NODE_ENV FISSO a production: in development NestJS GraphQL tenta di
      # scrivere lo schema in /app/src (non scrivibile dall'utente del
      # container) → crash EACCES. In production scrive in /tmp. NON renderlo
      # sovrascrivibile da .env per evitare il crash-loop.
      NODE_ENV: production
      PORT: 3000
      # OpenBao Agent gira sull'host. 172.19.0.1 è il gateway del network
      # evolution_net (allineato al pattern accounting).
      OPENBAO_ADDR: ${OPENBAO_ADDR:-http://172.19.0.1:8203}
      OPENBAO_AGENT_MODE: "true"
      OPENBAO_AGENT_TOKEN_PATH: /var/run/openbao-agent-clinico/clinico-token
      # Documenti paziente — S3 MicroCeph (creds da OpenBao kv/clinico/s3)
      # + envelope encryption Transit (chiave clinico-docs-<tenantAlias>).
      # La VM MicroCeph deve essere raggiungibile dalla rete del container.
      DOCS_BUCKET_PREFIX: ${DOCS_BUCKET_PREFIX:-curandis-clinico-docs}
      DOCS_TRANSIT_KEY_PREFIX: ${DOCS_TRANSIT_KEY_PREFIX:-clinico-docs}
      DOCS_MAX_FILE_MB: ${DOCS_MAX_FILE_MB:-500}
      # Stato dell'app Curandis presso Google, a livello di SaaS.
      # Finche' e' "true" i permessi Google scadono ogni 7 giorni (regola delle
      # app in Testing) e la UI mostra il conto alla rovescia con gli avvisi di
      # rinnovo. A VERIFICA OTTENUTA metterlo a "false": la scadenza fissa non
      # esiste piu' e il conto alla rovescia direbbe il falso.
      # Non sta in OpenBao perche' non e' un segreto — e li' dentro nessuno lo
      # troverebbe. Quando esistera' l'amministrazione SaaS si sposta la'.
      GOOGLE_OAUTH_TESTING_MODE: ${GOOGLE_OAUTH_TESTING_MODE:-true}
      GOOGLE_OAUTH_TOKEN_DAYS: ${GOOGLE_OAUTH_TOKEN_DAYS:-7}
      GOOGLE_OAUTH_ALERT_DAYS_BEFORE: ${GOOGLE_OAUTH_ALERT_DAYS_BEFORE:-2}
      # Keycloak OIDC
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-curandis}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-curandis-app-angular}
      # Tenant Management System
      TMS_URL: ${TMS_URL:-https://api.curandis.cloud}
      # Registry — anagrafica condivisa
      REGISTRY_BASE_URL_PATTERN: ${REGISTRY_BASE_URL_PATTERN:-https://registry.{tenant}.curandis.cloud/api/v1/registry}
      REGISTRY_DEFAULT_TENANT: ${REGISTRY_DEFAULT_TENANT:-bdq}
      REGISTRY_HTTP_TIMEOUT_MS: ${REGISTRY_HTTP_TIMEOUT_MS:-7000}
      REGISTRY_HTTP_RETRY_COUNT: ${REGISTRY_HTTP_RETRY_COUNT:-2}
      # Accounting — proxy REST on-demand (metodi pagamento, voucher, PDF fattura).
      # Prefisso globale accounting = /api/v1/accounting (NON solo /api).
      ACCOUNTING_BASE_URL_PATTERN: ${ACCOUNTING_BASE_URL_PATTERN:-https://accounting.{tenant}.curandis.cloud/api/v1/accounting}
      ACCOUNTING_HTTP_TIMEOUT_MS: ${ACCOUNTING_HTTP_TIMEOUT_MS:-15000}
      # RabbitMQ — config statica (host/port/user/password/vhost arrivano
      # da OpenBao kv/clinico/rabbitmq al bootstrap, vedi main.ts).
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_REGISTRY_EXCHANGE: ${RABBITMQ_REGISTRY_EXCHANGE:-ex.registry.events}
      RABBITMQ_QUEUE_SUBJECTS: ${RABBITMQ_QUEUE_SUBJECTS:-q.clinico.subjects}
      RABBITMQ_BINDING_PATTERN: "${RABBITMQ_BINDING_PATTERN:-subject.#}"
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
      # DLQ monitor — utente dedicato SOLO management API read-only (tag
      # monitoring, permessi AMQP nulli). Senza queste vars il monitor
      # ripiegava sull'utenza AMQP di OpenBao, che non ha il tag management
      # → 401 "Not management user" su ogni check (monitor cieco).
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-http://curandis-rabbitmq:15672}
      RABBITMQ_MANAGEMENT_USER: ${RABBITMQ_MANAGEMENT_USER:-curandis-monitor-svc}
      RABBITMQ_MANAGEMENT_PASS: ${RABBITMQ_MANAGEMENT_PASS}
      RABBITMQ_MANAGEMENT_VHOST: ${RABBITMQ_MANAGEMENT_VHOST:-curandis}
    volumes:
      # Sink del token OpenBao Agent. Read-only: il container non scrive,
      # legge solo. Bind mount preserva i permessi 0640 root:openbao-agent;
      # il container è membro del gruppo openbao-agent (Dockerfile) → OK.
      - /run/openbao-agent-clinico:/var/run/openbao-agent-clinico:ro
    extra_hosts:
      # Permette al container di raggiungere host services per nome
      # (utile per debug / connessioni dirette a postgres-agenda dell'host).
      - "host.docker.internal:host-gateway"
    ports:
      - "${CLINICO_BACKEND_PORT:-3000}:3000"
    networks:
      - clinico_network
      - curandis_network    # broker condiviso curandis-rabbitmq
      - evolution_net       # OpenBao agent host (172.19.0.1)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  clinico-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Credenziale di sola lettura per il package registry GitLab, da cui
      # arrivano template-core e template-editor.
      secrets:
        - npmrc
    image: curandis/clinico-frontend:latest
    container_name: curandis-clinico-frontend
    restart: unless-stopped
    depends_on:
      clinico-backend:
        condition: service_healthy
    ports:
      - "${CLINICO_FRONTEND_PORT:-4200}:80"
    networks:
      - clinico_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Network locale per la coppia clinico-backend ↔ clinico-frontend.
  clinico_network:
    driver: bridge

  # Network condiviso platform: per parlare con curandis-rabbitmq
  # (e in futuro curandis-redis se lo condividiamo).
  curandis_network:
    external: true
    name: curandis-common-services_curandis_network

  # Rete Evolution Manager — usata per raggiungere l'OpenBao Agent
  # sull'host via 172.19.0.1 (stesso pattern di accounting).
  evolution_net:
    external: true
    name: evolution-net

# ── Secrets di build ────────────────────────────────────────────
# Credenziale di sola lettura per il package registry GitLab (project 4).
# Il file vive FUORI dal repo apposta, così non può finire in un commit.
# È un Deploy token con il solo scope read_package_registry: non può
# pubblicare né leggere il codice sorgente.
secrets:
  npmrc:
    file: /home/marco/.curandis/npmrc-build
