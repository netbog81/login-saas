<div class="operator-workspace">
  <!-- Header -->
  <header class="workspace-header">
    <div class="header-left">
      <app-operator-selector
        [operators]="operators"
        [selectedOperator]="selectedOperator"
        [loading]="loadingOperators"
        (operatorChange)="onOperatorChange($event)">
      </app-operator-selector>
    </div>

    <div class="header-center">
      <h1 class="page-title">Workspace Operatore</h1>
    </div>

    <div class="header-right">
      <span class="current-date">{{ formatFullDate(today) }}</span>
    </div>
  </header>

  <!-- Error banner -->
  <div class="error-banner" *ngIf="error">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>{{ error }}</span>
    <button (click)="error = null">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div class="workspace-content">
    <!-- Sidebar: Appointments list -->
    <aside class="appointments-sidebar-wrapper" [class.collapsed]="sidebarCollapsed">
      <app-daily-appointments-list
        [appointments]="todayAppointments"
        [selectedAppointment]="selectedAppointment"
        [loading]="loadingAppointments"
        [collapsed]="sidebarCollapsed"
        (appointmentSelect)="onAppointmentSelect($event)"
        (toggleCollapse)="onToggleSidebar()">
      </app-daily-appointments-list>
    </aside>

    <!-- Main area -->
    <main class="main-area">
      <!-- No operator selected -->
      <div class="empty-state-full" *ngIf="!selectedOperator && !loadingOperators">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <h2>Seleziona un operatore</h2>
        <p>Usa il menu in alto a sinistra per selezionare l'operatore</p>
      </div>

      <!-- Loading operators -->
      <div class="loading-state-full" *ngIf="loadingOperators">
        <div class="spinner"></div>
        <span>Caricamento operatori...</span>
      </div>

      <!-- Content when operator is selected -->
      <div class="main-content" *ngIf="selectedOperator && !loadingOperators">
        <!-- Current treatment section -->
        <section class="current-treatment-section">
          <!-- No appointment selected -->
          <div class="empty-selection" *ngIf="!selectedAppointment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <h3>Seleziona un appuntamento</h3>
            <p>Clicca su un appuntamento dalla lista per iniziare</p>
          </div>

          <!-- Appointment card -->
          <app-current-treatment-card
            *ngIf="selectedAppointment"
            [appointment]="selectedAppointment"
            [patient]="selectedPatient"
            [loading]="loadingPatient"
            (startTreatment)="onStartTreatment()"
            (completeTreatment)="onCompleteTreatment($event)"
            (viewPatientFolder)="onViewPatientFolder()"
            (cancelAppointment)="onCancelAppointment()">
          </app-current-treatment-card>
        </section>

        <!-- Patient folder section -->
        <section class="patient-folder-section">
          <app-patient-folder
            [patient]="selectedPatient"
            [paths]="patientPaths"
            [loading]="loadingPatient"
            [currentOperatorId]="selectedOperator?.id ?? null"
            (pathSelect)="onPathSelect($event)"
            (viewPatientDetails)="onViewPatientDetails($event)"
            (pathCreated)="onPathCreated($event)"
            (pathUpdated)="onPathUpdated($event)"
            (pathDeleted)="onPathDeleted($event)">
          </app-patient-folder>
        </section>
      </div>
    </main>
  </div>
</div>
