<div class="appointments-sidebar" [class.collapsed]="collapsed">
  <!-- Header -->
  <div class="sidebar-header">
    <div class="header-content" *ngIf="!collapsed">
      <h3 class="header-title">Appuntamenti</h3>
      <div class="header-stats">
        <span class="stat">{{ appointments.length }} totali</span>
        <span class="stat-divider">|</span>
        <span class="stat completed">{{ completedCount }} completati</span>
      </div>
    </div>

    <button class="collapse-btn" (click)="onToggleCollapse()" [attr.aria-label]="collapsed ? 'Espandi sidebar' : 'Comprimi sidebar'">
      <svg *ngIf="!collapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 19l-7-7 7-7" />
      </svg>
      <svg *ngIf="collapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="sidebar-content" *ngIf="!collapsed">
    <!-- Loading state -->
    <div class="loading-state" *ngIf="loading">
      <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5]">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-text">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="!loading && appointments.length === 0">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <p class="empty-text">Nessun appuntamento oggi</p>
    </div>

    <!-- Appointments list -->
    <div class="appointments-list" *ngIf="!loading && appointments.length > 0">
      <button
        *ngFor="let appointment of sortedAppointments"
        class="appointment-item"
        [class.selected]="isSelected(appointment)"
        [class]="getStatusClass(appointment)"
        (click)="onAppointmentClick(appointment)">

        <!-- Time -->
        <div class="appointment-time">
          <span class="time-start">{{ formatTime(appointment.startTime) }}</span>
          <span class="time-separator">-</span>
          <span class="time-end">{{ formatTime(appointment.endTime) }}</span>
        </div>

        <!-- Client info -->
        <div class="appointment-info">
          <div class="client-avatar" [class]="getStatusClass(appointment)">
            {{ getClientInitials(appointment) }}
          </div>
          <div class="client-details">
            <span class="client-name">{{ getClientName(appointment) }}</span>
            <span class="appointment-status">{{ getStatusLabel(appointment) }}</span>
          </div>
        </div>

        <!-- Status indicator -->
        <div class="status-indicator" [class]="getStatusClass(appointment)"></div>
      </button>
    </div>
  </div>

  <!-- Collapsed mini view -->
  <div class="collapsed-content" *ngIf="collapsed">
    <div class="mini-count">{{ appointments.length }}</div>
    <div
      *ngFor="let appointment of sortedAppointments.slice(0, 6)"
      class="mini-avatar"
      [class.selected]="isSelected(appointment)"
      [class]="getStatusClass(appointment)"
      (click)="onAppointmentClick(appointment)"
      [title]="getClientName(appointment) + ' - ' + formatTime(appointment.startTime)">
      {{ getClientInitials(appointment) }}
    </div>
    <div class="mini-more" *ngIf="appointments.length > 6">
      +{{ appointments.length - 6 }}
    </div>
  </div>
</div>
