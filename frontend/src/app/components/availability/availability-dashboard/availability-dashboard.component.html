<div class="availability-dashboard">
  <!-- Header compatto: titolo + statistiche inline + aggiorna -->
  <div class="dashboard-header">
    <h1>Configurazioni</h1>

    <div class="statistics">
      <div class="stat-card">
        <span class="stat-value">{{ totalOperators }}</span>
        <span class="stat-label">Operatori totali ({{ activeOperators }} attivi)</span>
      </div>

      <div class="stat-card">
        <span class="stat-value">{{ totalServices }}</span>
        <span class="stat-label">Servizi totali ({{ activeServices }} attivi)</span>
      </div>

      <button class="refresh-btn" (click)="refreshData()" title="Aggiorna dati">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Aggiorna
      </button>
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-container">
    <div class="tabs">
      <button class="tab"
              [class.active]="activeTab === 'operators'"
              (click)="setActiveTab('operators')">
        Operatori
      </button>
      <button class="tab"
              [class.active]="activeTab === 'categories'"
              (click)="setActiveTab('categories')">
        Categoria operatori
      </button>
      <button class="tab"
              [class.active]="activeTab === 'services'"
              (click)="setActiveTab('services')">
        Servizi
      </button>
      <button class="tab"
              [class.active]="activeTab === 'subcategories'"
              (click)="setActiveTab('subcategories')">
        Sotto-Categorie
      </button>
      <button class="tab"
              [class.active]="activeTab === 'invoice-descriptions'"
              (click)="setActiveTab('invoice-descriptions')">
        Descrizione righe fattura
      </button>
      <button class="tab"
              [class.active]="activeTab === 'templates'"
              (click)="setActiveTab('templates')">
        Template Orari
      </button>
      <button class="tab"
              [class.active]="activeTab === 'assignments'"
              (click)="setActiveTab('assignments')">
        Assegnazioni
      </button>
      <button class="tab"
              [class.active]="activeTab === 'instrumentation'"
              (click)="setActiveTab('instrumentation')">
        Strumentazione
      </button>
      <button class="tab"
              [class.active]="activeTab === 'gyms'"
              (click)="setActiveTab('gyms')">
        Palestre
      </button>
      <button class="tab"
              [class.active]="activeTab === 'absence-types'"
              (click)="setActiveTab('absence-types')">
        Tipi di Assenza
      </button>
      <button class="tab"
              [class.active]="activeTab === 'calendar'"
              (click)="setActiveTab('calendar')">
        Calendario
      </button>
    </div>
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    <app-operator-management *ngIf="activeTab === 'operators'"></app-operator-management>
    <app-operator-category-management *ngIf="activeTab === 'categories'"></app-operator-category-management>
    <app-service-management *ngIf="activeTab === 'services'"></app-service-management>
    <app-service-subcategory-management *ngIf="activeTab === 'subcategories'"></app-service-subcategory-management>
    <app-invoice-prefixes-management *ngIf="activeTab === 'invoice-descriptions'"></app-invoice-prefixes-management>
    <app-template-management *ngIf="activeTab === 'templates'"></app-template-management>
    <app-operator-template-assignment *ngIf="activeTab === 'assignments'"></app-operator-template-assignment>
    <app-instrumentation-management *ngIf="activeTab === 'instrumentation'"></app-instrumentation-management>
    <app-gym-management *ngIf="activeTab === 'gyms'"></app-gym-management>
    <app-operator-absence-types-container *ngIf="activeTab === 'absence-types'"></app-operator-absence-types-container>

    <div *ngIf="activeTab === 'calendar'" class="coming-soon">
      <h3>Integrazione Calendario</h3>
      <p>Visualizzazione e gestione delle disponibilità direttamente sul calendario.</p>
      <p class="note">Funzionalità in sviluppo...</p>
    </div>
  </div>
</div>
