<div class="gym-weekly-grid">
  <!-- Header con giorni e palestre -->
  <div class="grid-header" [style.padding-right.px]="scrollbarWidth">
    <div class="time-column-header">Ora</div>

    <!-- Header per ogni giorno -->
    <div class="day-header-group" *ngFor="let day of dayColumns; trackBy: trackByDay">
      <div class="day-header" [class.today]="isToday(day.date)">
        <span class="day-name">{{ day.dayName }}</span>
        <span class="day-number">{{ day.dayNumber }}</span>
      </div>
      <!-- Sub-header per ogni palestra nel giorno -->
      <div class="gym-headers">
        <div class="gym-room-header"
             *ngFor="let gymRoom of gymRooms; trackBy: trackByGymRoom"
             [style.background-color]="getGymRoomColor(gymRoom)"
             [title]="gymRoom.name + ' - max ' + gymRoom.maxCapacity">
          <span class="gym-room-name">{{ gymRoom.name }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Body con time slots -->
  <div class="grid-body" #gridBody [style.height.px]="gridHeight">
    <!-- Time column -->
    <div class="time-column">
      <div class="time-slot"
           *ngFor="let slot of timeSlots; trackBy: trackByTimeSlot"
           [style.height.px]="slotHeight">
        <span class="time-label">{{ slot.time }}</span>
      </div>
    </div>

    <!-- Colonne per ogni giorno -->
    <div class="day-column-group" *ngFor="let day of dayColumns; trackBy: trackByDay">
      <!-- Colonne per ogni palestra nel giorno -->
      <div class="gym-room-column"
           *ngFor="let gymRoom of gymRooms; trackBy: trackByGymRoom"
           [attr.data-gym-room-id]="gymRoom.id"
           [attr.data-date]="day.date">

        <!-- Celle per ogni time slot -->
        <div class="gym-slot"
             *ngFor="let slot of timeSlots; trackBy: trackByTimeSlot"
             [class]="getSlotClass(day.date, gymRoom.id, slot.time)"
             [class.has-template]="hasTemplate(day.date, gymRoom.id, slot.time)"
             [style.height.px]="slotHeight"
             (click)="onSlotClick(gymRoom, day.date, slot.time, $event)"
             (dblclick)="onSlotDblClick(gymRoom, day.date, slot.time, $event)">

          <!-- Contenuto slot compatto per vista settimanale -->
          <ng-container *ngIf="hasTemplate(day.date, gymRoom.id, slot.time)">
            <span class="capacity-badge" [class.full]="!getSlotInfo(day.date, gymRoom.id, slot.time)?.isAvailable">
              {{ getCapacityText(day.date, gymRoom.id, slot.time) }}
            </span>
          </ng-container>

          <!-- Slot senza template -->
          <ng-container *ngIf="!hasTemplate(day.date, gymRoom.id, slot.time)">
            <span class="no-template">-</span>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="gymRooms.length === 0">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5h11v11h-11z"></path>
      <path d="M6.5 6.5L2 2"></path>
      <path d="M17.5 6.5L22 2"></path>
      <path d="M17.5 17.5L22 22"></path>
      <path d="M6.5 17.5L2 22"></path>
    </svg>
    <h3>Nessuna palestra configurata</h3>
    <p>Configura le palestre nella sezione Impostazioni</p>
  </div>
</div>
