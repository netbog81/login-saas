<div class="calendar-cell"
     [class.available]="isAvailable"
     [class.occupied]="isOccupied"
     [class.drag-target]="isDragTarget"
     [class.non-working]="!isWorkingHour">

  <!-- Time label (only shown in first column or when specified) -->
  <div class="time-label" *ngIf="showTimeLabel">
    {{ timeSlot.time }}
  </div>

  <!-- Overlay non disponibile in alto (disponibilità parziale) - solo se showUnavailableBackground -->
  <div class="partial-unavailable top"
       *ngIf="showUnavailableBackground && unavailableTopPercent > 0"
       [style.height.%]="unavailableTopPercent"></div>

  <!-- Overlay non disponibile in basso (disponibilità parziale) - solo se showUnavailableBackground -->
  <div class="partial-unavailable bottom"
       *ngIf="showUnavailableBackground && unavailableBottomPercent > 0"
       [style.height.%]="unavailableBottomPercent"></div>

  <!-- Visual indicator for availability (nascosto se ci sono overlay parziali o se showUnavailableBackground è false) -->
  <div class="cell-content" *ngIf="!isOccupied">
    <div class="availability-indicator" *ngIf="showUnavailableBackground && !isAvailable && unavailableTopPercent === 0 && unavailableBottomPercent === 0"></div>
  </div>
</div>
