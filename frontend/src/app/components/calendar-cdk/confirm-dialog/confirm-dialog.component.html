<div class="confirm-dialog-overlay" (click)="onCancel()">
  <div class="confirm-dialog" (click)="$event.stopPropagation()">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <h3 class="dialog-title">{{ title }}</h3>
      <button class="close-btn" (click)="onCancel()" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <p class="dialog-message">{{ message }}</p>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button class="btn btn-secondary" (click)="onCancel()" type="button">
        {{ cancelText }}
      </button>
      <button [class]="'btn ' + confirmButtonClass" (click)="onConfirm()" type="button">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
