<div class="calendar-event"
     cdkDrag
     [cdkDragBoundary]="'.calendar-grid'"
     [cdkDragDisabled]="isResizing"
     (cdkDragStarted)="onDragStarted($event)"
     (cdkDragEnded)="onDragEnded($event)"
     (click)="onClick($event)"
     (dblclick)="onDblClick($event)"
     [style.backgroundColor]="backgroundColor"
     [class.dragging]="isDragging"
     [class.resizing]="isResizing">

  <!-- Event content -->
  <div class="event-content">
    <!-- Header with time and delete button -->
    <div class="event-header">
      <span class="event-time">{{ displayTime }}</span>
      <button class="delete-button"
              (click)="onDeleteClick($event)"
              title="Elimina appuntamento">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>

    <!-- Title/Patient name -->
    <div class="event-title">
      {{ displayTitle }}
    </div>

    <!-- Notes preview (if available) -->
    <div class="event-notes" *ngIf="appointment.notes && height > 80">
      {{ appointment.notes }}
    </div>
  </div>

  <!-- Resize handle -->
  <div class="resize-handle"
       (mousedown)="onResizeStart($event)">
    <div class="resize-handle-bar"></div>
  </div>

  <!-- Drag preview (shown while dragging) -->
  <div class="drag-preview" *cdkDragPreview>
    <div class="preview-content" [style.backgroundColor]="backgroundColor">
      <div class="preview-time">{{ displayTime }}</div>
      <div class="preview-title">{{ displayTitle }}</div>
    </div>
  </div>

  <!-- Placeholder (shown in original position while dragging) -->
  <div class="drag-placeholder" *cdkDragPlaceholder>
    <div class="placeholder-content"></div>
  </div>
</div>
