<div class="calendar-grid-container">
  <!-- Main grid with users/dates -->
  <div class="grid-content">
    <!-- Headers for users/dates -->
    <div class="grid-header">
      <div class="time-column-header"></div>
      <div *ngFor="let user of users"
           class="user-header"
           [style.backgroundColor]="user.color">
        <span class="user-name">{{ user.name }}</span>
      </div>
    </div>

    <!-- Grid body with cells and events -->
    <div class="grid-body" #gridBody>
      <!-- Time column (sticky on left) -->
      <div class="time-column">
        <div class="time-slots">
          <div *ngFor="let slot of timeSlots"
               class="time-slot"
               [style.height.px]="slotHeight">
            <span class="time-label">{{ slot.time }}</span>
          </div>
        </div>
      </div>

      <!-- Columns for each user -->
      <div *ngFor="let user of users"
           class="user-column">

        <!-- Cells grid -->
        <div class="cells-container">
          <app-calendar-cell
            *ngFor="let slot of timeSlots"
            [timeSlot]="slot"
            [date]="date"
            [user]="user"
            [slotHeight]="slotHeight"
            [isAvailable]="isCellAvailable(user.operatorId!, date, slot.time)"
            [isOccupied]="isCellOccupied(user.operatorId!, date, slot.time)"
            [isDragSelected]="isCellInDragSelection(user.operatorId!, date, slot.time)"
            [dragSelectionColor]="getUserColorForDrag(user.operatorId!)"
            (cellMouseDown)="onCellMouseDown($event)"
            (cellMouseEnter)="onCellMouseEnter($event)"
            (cellMouseUp)="onCellMouseUp($event)"
            (cellDblClick)="onCellDblClick($event)">
          </app-calendar-cell>
        </div>

        <!-- Available slots layer (absolute positioned, below events) -->
        <div class="available-slots-container">
          <app-available-slot-overlay
            *ngFor="let slotPos of getAvailableSlotsForUser(user.operatorId!)"
            [operatorId]="slotPos.slot.operatorId"
            [date]="slotPos.slot.date"
            [startTime]="slotPos.slot.startTime"
            [endTime]="slotPos.slot.endTime"
            [top]="slotPos.top"
            [height]="slotPos.height"
            [color]="slotPos.slot.color"
            [availableInstruments]="slotPos.slot.availableInstruments"
            (slotClick)="onAvailableSlotClick($event)"
            (slotDblClick)="onAvailableSlotDblClick($event)">
          </app-available-slot-overlay>
        </div>

        <!-- Events layer (absolute positioned) -->
        <div class="events-container">
          <app-calendar-event
            *ngFor="let eventPos of getEventsForUser(user.operatorId!)"
            [appointment]="eventPos.appointment"
            [user]="user"
            [top]="eventPos.top"
            [height]="eventPos.height"
            [width]="eventPos.width"
            [left]="eventPos.left"
            [slotDuration]="slotDuration"
            [totalSelectedUsers]="users.length"
            (eventClick)="onEventClick($event)"
            (eventDblClick)="onEventDblClick($event)"
            (eventDragStart)="onEventDragStart($event)"
            (eventDragEnd)="onEventDragEnd($event)"
            (eventResize)="onEventResize($event)"
            (eventDelete)="onEventDelete($event)">
          </app-calendar-event>
        </div>
      </div>
    </div>
  </div>
</div>
