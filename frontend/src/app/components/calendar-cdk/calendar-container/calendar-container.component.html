<div class="calendar-container">
  <!-- Header -->
  <app-calendar-header
    [currentDate]="currentDate"
    [viewType]="config.viewType"
    [viewMode]="config.viewMode"
    [visibleDates]="visibleDates"
    (navigateToday)="onNavigateToday()"
    (navigatePrevious)="onNavigatePrevious()"
    (navigateNext)="onNavigateNext()"
    (viewTypeChange)="onViewTypeChange($event)">
  </app-calendar-header>

  <!-- Toolbar -->
  <app-calendar-toolbar
    [config]="config"
    (configChange)="onConfigChange($event)"
    (openWorkingHoursDialog)="onOpenWorkingHoursDialog()">
  </app-calendar-toolbar>

  <!-- Users Legend (shown when user names don't fit in grid columns) - only in operators view -->
  <app-users-legend
    *ngIf="config.showOperatorsLegend && config.viewMode === 'operators'"
    [users]="allUsers"
    [selectedUsers]="selectedOperators"
    [showToggle]="true"
    (userToggle)="onUserToggle($event)"
    class="users-legend-bar">
  </app-users-legend>

  <!-- Main content area -->
  <div class="calendar-main">
    <!-- Sidebar - only in operators view -->
    <app-calendar-sidebar
      *ngIf="config.viewMode === 'operators'"
      [allUsers]="allUsers"
      [selectedUsers]="selectedOperators"
      [collapsed]="sidebarCollapsed"
      [selectedMacroCategory]="selectedMacroCategory"
      [searchFilters]="searchFilters"
      [instrumentCategories]="instrumentCategories"
      [slotSearchEnabled]="slotSearchEnabled"
      [ongoingTreatments]="ongoingTreatments"
      [loadingTreatments]="loadingTreatments"
      (userToggle)="onUserToggle($event)"
      (selectAll)="onSelectAllUsers()"
      (deselectAll)="onDeselectAllUsers()"
      (toggleCollapse)="onToggleSidebar()"
      (macroCategoryChange)="onMacroCategoryChange($event)"
      (searchFiltersChange)="onSearchFiltersChange($event)"
      (slotSearchToggle)="onSlotSearchToggle($event)">
    </app-calendar-sidebar>

    <!-- Grid area -->
    <div class="calendar-grid-area">
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Caricamento...</p>
      </div>

      <!-- VISTA OPERATORI - Daily Grid -->
      <app-calendar-grid
        *ngIf="!isLoading && selectedOperators.length > 0 && config.viewType === 'daily' && config.viewMode === 'operators'"
        [timeSlots]="timeSlots"
        [users]="selectedOperators"
        [date]="mainDate"
        [appointments]="appointments"
        [availabilities]="availabilities"
        [slotDuration]="config.slotDuration"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [viewType]="config.viewType"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        [showUnavailableCellsBackground]="config.showUnavailableCellsBackground"
        [dragStartCell]="dragStartCell"
        [dragCurrentCell]="dragCurrentCell"
        [isDragging]="isDragging"
        [searchAvailableSlots]="availableSlots"
        (cellMouseDown)="onCellMouseDown($event)"
        (cellMouseEnter)="onCellMouseEnter($event)"
        (cellMouseUp)="onCellMouseUp($event)"
        (cellDblClick)="onCellDblClick($event)"
        (eventClick)="onEventClick($event)"
        (eventDblClick)="onEventDblClick($event)"
        (eventDragStart)="onEventDragStart($event)"
        (eventDragEnd)="onEventDragEnd($event)"
        (eventResize)="onEventResize($event)"
        (eventDelete)="onEventDelete($event)"
        (availableSlotClick)="onAvailableSlotClick($event)"
        (availableSlotDblClick)="onAvailableSlotDblClick($event)">
      </app-calendar-grid>

      <!-- VISTA OPERATORI - Weekly Grid -->
      <app-calendar-weekly-grid
        *ngIf="!isLoading && selectedOperators.length > 0 && config.viewType === 'weekly' && config.viewMode === 'operators'"
        [timeSlots]="timeSlots"
        [users]="selectedOperators"
        [dates]="visibleDates"
        [appointments]="appointments"
        [availabilities]="availabilities"
        [dragStartCell]="dragStartCell"
        [dragCurrentCell]="dragCurrentCell"
        [isDragging]="isDragging"
        [slotDuration]="config.slotDuration"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [showWeekend]="config.showWeekend"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        [showUnavailableCellsBackground]="config.showUnavailableCellsBackground"
        [searchAvailableSlots]="availableSlots"
        (cellMouseDown)="onCellMouseDown($event)"
        (cellMouseEnter)="onCellMouseEnter($event)"
        (cellMouseUp)="onCellMouseUp($event)"
        (cellDblClick)="onCellDblClick($event)"
        (eventClick)="onEventClick($event)"
        (eventDblClick)="onEventDblClick($event)"
        (eventDragStart)="onEventDragStart($event)"
        (eventDragEnd)="onEventDragEnd($event)"
        (eventResize)="onEventResize($event)"
        (eventDelete)="onEventDelete($event)"
        (availableSlotClick)="onAvailableSlotClick($event)"
        (availableSlotDblClick)="onAvailableSlotDblClick($event)">
      </app-calendar-weekly-grid>

      <!-- VISTA PALESTRE - Daily Gym Grid -->
      <app-gym-calendar-grid
        *ngIf="!isLoading && config.viewMode === 'gyms' && config.viewType === 'daily'"
        [timeSlots]="gymTimeSlots"
        [gymRooms]="gymRooms"
        [date]="mainDate"
        [slotsInfo]="gymSlotsInfo"
        [appointments]="gymAppointments"
        [slotDuration]="60"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        (slotClick)="onGymSlotClick($event)"
        (slotDblClick)="onGymSlotDblClick($event)"
        (appointmentClick)="onGymAppointmentClick($event)">
      </app-gym-calendar-grid>

      <!-- VISTA PALESTRE - Weekly Gym Grid -->
      <app-gym-weekly-grid
        *ngIf="!isLoading && config.viewMode === 'gyms' && config.viewType === 'weekly'"
        [timeSlots]="gymTimeSlots"
        [gymRooms]="gymRooms"
        [dates]="visibleDates"
        [slotsInfo]="gymWeeklySlotsInfo"
        [appointments]="gymWeeklyAppointments"
        [slotDuration]="60"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        [showWeekend]="config.showWeekend"
        (slotClick)="onGymSlotClick($event)"
        (slotDblClick)="onGymSlotDblClick($event)"
        (appointmentClick)="onGymAppointmentClick($event)">
      </app-gym-weekly-grid>

      <!-- Empty state - Operators view -->
      <div *ngIf="!isLoading && selectedOperators.length === 0 && config.viewMode === 'operators'" class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <h3>Nessun operatore selezionato</h3>
        <p>Seleziona almeno un operatore dalla sidebar per visualizzare il calendario</p>
      </div>
    </div>
  </div>

  <!-- Event Dialog (Modal) -->
  <div class="dialog-overlay" *ngIf="showEventDialog"
       (mousedown)="onOverlayMouseDown($event)"
       (click)="onOverlayClick($event, 'event')">
    <div class="dialog-content" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <app-event-dialog
        [data]="eventDialogData"
        (result)="onDialogResult($event)">
      </app-event-dialog>
    </div>
  </div>

  <!-- Delete Confirmation Dialog -->
  <div class="dialog-overlay" *ngIf="showDeleteConfirmDialog"
       (mousedown)="onOverlayMouseDown($event)"
       (click)="onOverlayClick($event, 'delete')">
    <div class="dialog-content" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <app-confirm-dialog
        title="Elimina Appuntamento"
        [message]="'Sei sicuro di voler eliminare l\'appuntamento per ' + (appointmentToDelete?.title || 'questo appuntamento') + '?'"
        confirmText="Elimina"
        cancelText="Annulla"
        confirmButtonClass="btn-danger"
        (confirm)="onDeleteConfirm()"
        (cancel)="onDeleteCancel()">
      </app-confirm-dialog>
    </div>
  </div>

  <!-- Working Hours Dialog -->
  <div class="dialog-overlay" *ngIf="showWorkingHoursDialog"
       (mousedown)="onOverlayMouseDown($event)"
       (click)="onOverlayClick($event, 'workingHours')">
    <div class="dialog-content" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <app-working-hours-dialog
        [data]="workingHoursDialogData"
        (result)="onWorkingHoursDialogResult($event)">
      </app-working-hours-dialog>
    </div>
  </div>

  <!-- Gym Appointment Dialog -->
  <div class="dialog-overlay" *ngIf="showGymAppointmentDialog"
       (mousedown)="onOverlayMouseDown($event)"
       (click)="onOverlayClick($event, 'gymAppointment')">
    <div class="dialog-content" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <app-gym-appointment-dialog
        [data]="gymAppointmentDialogData"
        (result)="onGymAppointmentDialogResult($event)">
      </app-gym-appointment-dialog>
    </div>
  </div>

  <!-- Gym Appointment Delete Confirmation Dialog -->
  <div class="dialog-overlay" *ngIf="showGymDeleteConfirmDialog"
       (mousedown)="onOverlayMouseDown($event)"
       (click)="onOverlayClick($event, 'gymDelete')">
    <div class="dialog-content" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <app-confirm-dialog
        title="Elimina Prenotazione Palestra"
        [message]="'Sei sicuro di voler eliminare la prenotazione di ' + (gymAppointmentToDelete?.clientName || 'questo partecipante') + '?'"
        confirmText="Elimina"
        cancelText="Annulla"
        confirmButtonClass="btn-danger"
        (confirm)="onGymDeleteConfirm()"
        (cancel)="onGymDeleteCancel()">
      </app-confirm-dialog>
    </div>
  </div>
</div>
