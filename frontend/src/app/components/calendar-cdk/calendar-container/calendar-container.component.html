<div class="calendar-container">
  <!-- Header -->
  <app-calendar-header
    [currentDate]="currentDate"
    [viewType]="config.viewType"
    [visibleDates]="visibleDates"
    (navigateToday)="onNavigateToday()"
    (navigatePrevious)="onNavigatePrevious()"
    (navigateNext)="onNavigateNext()"
    (viewTypeChange)="onViewTypeChange($event)">
  </app-calendar-header>

  <!-- Toolbar -->
  <app-calendar-toolbar
    [config]="config"
    (configChange)="onConfigChange($event)"
    (openWorkingHoursDialog)="onOpenWorkingHoursDialog()">
  </app-calendar-toolbar>

  <!-- Users Legend (shown when user names don't fit in grid columns) -->
  <app-users-legend
    *ngIf="config.showOperatorsLegend"
    [users]="allUsers"
    [selectedUsers]="selectedOperators"
    [showToggle]="true"
    (userToggle)="onUserToggle($event)"
    class="users-legend-bar">
  </app-users-legend>

  <!-- Main content area -->
  <div class="calendar-main">
    <!-- Sidebar -->
    <app-calendar-sidebar
      [allUsers]="allUsers"
      [selectedUsers]="selectedOperators"
      [collapsed]="sidebarCollapsed"
      [selectedMacroCategory]="selectedMacroCategory"
      (userToggle)="onUserToggle($event)"
      (selectAll)="onSelectAllUsers()"
      (deselectAll)="onDeselectAllUsers()"
      (toggleCollapse)="onToggleSidebar()"
      (macroCategoryChange)="onMacroCategoryChange($event)">
    </app-calendar-sidebar>

    <!-- Grid area -->
    <div class="calendar-grid-area">
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Caricamento...</p>
      </div>

      <app-calendar-grid
        *ngIf="!isLoading && selectedOperators.length > 0 && config.viewType === 'daily'"
        [timeSlots]="timeSlots"
        [users]="selectedOperators"
        [date]="mainDate"
        [appointments]="appointments"
        [availabilities]="availabilities"
        [slotDuration]="config.slotDuration"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [viewType]="config.viewType"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        [dragStartCell]="dragStartCell"
        [dragCurrentCell]="dragCurrentCell"
        [isDragging]="isDragging"
        (cellMouseDown)="onCellMouseDown($event)"
        (cellMouseEnter)="onCellMouseEnter($event)"
        (cellMouseUp)="onCellMouseUp($event)"
        (cellDblClick)="onCellDblClick($event)"
        (eventClick)="onEventClick($event)"
        (eventDblClick)="onEventDblClick($event)"
        (eventDragStart)="onEventDragStart($event)"
        (eventDragEnd)="onEventDragEnd($event)"
        (eventResize)="onEventResize($event)"
        (eventDelete)="onEventDelete($event)">
      </app-calendar-grid>

      <app-calendar-weekly-grid
        *ngIf="!isLoading && selectedOperators.length > 0 && config.viewType === 'weekly'"
        [timeSlots]="timeSlots"
        [users]="selectedOperators"
        [dates]="visibleDates"
        [appointments]="appointments"
        [availabilities]="availabilities"
        [dragStartCell]="dragStartCell"
        [dragCurrentCell]="dragCurrentCell"
        [isDragging]="isDragging"
        [slotDuration]="config.slotDuration"
        [slotHeight]="slotHeight"
        [startHour]="config.showWorkingHoursOnly ? config.workingHoursStart : config.startHour"
        [showWeekend]="config.showWeekend"
        [showWorkingHoursOnly]="config.showWorkingHoursOnly"
        (cellMouseDown)="onCellMouseDown($event)"
        (cellMouseEnter)="onCellMouseEnter($event)"
        (cellMouseUp)="onCellMouseUp($event)"
        (cellDblClick)="onCellDblClick($event)"
        (eventClick)="onEventClick($event)"
        (eventDblClick)="onEventDblClick($event)"
        (eventDragStart)="onEventDragStart($event)"
        (eventDragEnd)="onEventDragEnd($event)"
        (eventResize)="onEventResize($event)"
        (eventDelete)="onEventDelete($event)">
      </app-calendar-weekly-grid>

      <!-- Empty state -->
      <div *ngIf="!isLoading && selectedOperators.length === 0" class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <h3>Nessun operatore selezionato</h3>
        <p>Seleziona almeno un operatore dalla sidebar per visualizzare il calendario</p>
      </div>
    </div>
  </div>

  <!-- Event Dialog (Modal) -->
  <div class="dialog-overlay" *ngIf="showEventDialog" (click)="onDialogResult({action: 'cancel'})">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <app-event-dialog
        [data]="eventDialogData"
        (result)="onDialogResult($event)">
      </app-event-dialog>
    </div>
  </div>

  <!-- Delete Confirmation Dialog -->
  <div class="dialog-overlay" *ngIf="showDeleteConfirmDialog" (click)="onDeleteCancel()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <app-confirm-dialog
        title="Elimina Appuntamento"
        [message]="'Sei sicuro di voler eliminare l\'appuntamento per ' + (appointmentToDelete?.title || 'questo appuntamento') + '?'"
        confirmText="Elimina"
        cancelText="Annulla"
        confirmButtonClass="btn-danger"
        (confirm)="onDeleteConfirm()"
        (cancel)="onDeleteCancel()">
      </app-confirm-dialog>
    </div>
  </div>

  <!-- Working Hours Dialog -->
  <div class="dialog-overlay" *ngIf="showWorkingHoursDialog" (click)="onWorkingHoursDialogResult({action: 'cancel'})">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <app-working-hours-dialog
        [data]="workingHoursDialogData"
        (result)="onWorkingHoursDialogResult($event)">
      </app-working-hours-dialog>
    </div>
  </div>
</div>
