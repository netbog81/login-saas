<div class="calendar-sidebar" [class.collapsed]="collapsed">
  <!-- Collapse toggle button -->
  <button class="collapse-toggle"
          (click)="onToggleCollapse()"
          [title]="collapsed ? 'Espandi' : 'Comprimi'">
    <svg *ngIf="!collapsed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    <svg *ngIf="collapsed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Sidebar content (hidden when collapsed) -->
  <div class="sidebar-content" *ngIf="!collapsed">
    <!-- PANNELLO 1: OPERATORI -->
    <div class="collapsible-panel">
      <!-- Panel header -->
      <div class="panel-header" (click)="toggleOperatorsExpanded()">
        <h3 class="panel-title">Operatori</h3>
        <svg *ngIf="operatorsExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!operatorsExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Panel content -->
      <div class="panel-content operators-content" *ngIf="operatorsExpanded">
        <!-- Select all toggle -->
        <button class="btn-select-all"
                (click)="onSelectAll()"
                [class.all-selected]="allSelected"
                [class.some-selected]="someSelected">
          <svg *ngIf="allSelected" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <svg *ngIf="someSelected && !allSelected" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>{{ allSelected ? 'Deseleziona tutti' : 'Seleziona tutti' }}</span>
        </button>

        <!-- Category filter -->
        <div class="category-filter-inline">
          <select [value]="selectedMacroCategory || ''"
                  (change)="onCategoryChange($any($event.target).value)">
            <option *ngFor="let cat of categories" [value]="cat.value || ''">
              {{ cat.label }}
            </option>
          </select>
        </div>

        <!-- User list -->
        <div class="user-list">
          <div *ngFor="let user of allUsers"
               class="user-item"
               [class.selected]="isUserSelected(user)"
               [class.inactive]="!user.active"
               (click)="onUserToggle(user)">

            <!-- Color indicator -->
            <div class="user-color"
                 [style.backgroundColor]="user.color">
            </div>

            <!-- User info -->
            <div class="user-info">
              <div class="user-name-row">
                <span class="user-name">{{ user.name }}</span>
                <!-- Warning per operatore senza template -->
                <span *ngIf="hasNoTemplate(user)"
                      class="no-template-warning"
                      title="Nessun template di disponibilità assegnato - tutte le celle sono disponibili">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                </span>
              </div>
              <span class="user-type">{{ user.type }}</span>
            </div>

            <!-- Checkbox -->
            <div class="user-checkbox">
              <input type="checkbox"
                     [checked]="isUserSelected(user)"
                     [disabled]="!user.active"
                     (click)="$event.stopPropagation()"
                     (change)="onUserToggle(user)">
            </div>
          </div>

          <!-- Empty state -->
          <div *ngIf="allUsers.length === 0" class="empty-state">
            <p>Nessun operatore disponibile</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PANNELLO 2: RICERCA DISPONIBILITÀ -->
    <div class="collapsible-panel">
      <!-- Panel header -->
      <div class="panel-header" (click)="toggleFiltersExpanded()">
        <h3 class="panel-title">Ricerca Disponibilità</h3>
        <svg *ngIf="filtersExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!filtersExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Panel content -->
      <div class="panel-content filters-content" *ngIf="filtersExpanded">
        <!-- Toggle ricerca slot disponibili -->
        <div class="filter-group toggle-main">
          <label class="filter-checkbox toggle-search">
            <input type="checkbox"
                   [checked]="slotSearchEnabled"
                   (change)="onSlotSearchToggle($any($event.target).checked)">
            <span>Mostra slot disponibili</span>
          </label>
        </div>

        <!-- Duration -->
        <div class="filter-group" [class.disabled]="!slotSearchEnabled">
          <label class="filter-label">Durata</label>
          <select [ngModel]="searchFilters.duration"
                  (ngModelChange)="onDurationChange($event)">
            <option *ngFor="let dur of durations" [ngValue]="dur.value">
              {{ dur.label }}
            </option>
          </select>
        </div>

        <!-- With Instrument toggle -->
        <div class="filter-group" *ngIf="canHaveInstrument && slotSearchEnabled">
          <label class="filter-checkbox">
            <input type="checkbox"
                   [checked]="searchFilters.withInstrument"
                   (change)="onWithInstrumentChange($any($event.target).checked)">
            <span>Con strumento</span>
          </label>
        </div>

        <!-- Instrument Count -->
        <div class="filter-group" *ngIf="showInstrumentCount && slotSearchEnabled">
          <label class="filter-label">Numero strumenti</label>
          <div class="radio-group">
            <label class="filter-radio">
              <input type="radio"
                     name="instrumentCount"
                     [value]="1"
                     [checked]="searchFilters.instrumentCount === 1"
                     (change)="onInstrumentCountChange(1)">
              <span>1 strumento</span>
            </label>
            <label class="filter-radio" *ngIf="canHaveTwoInstruments">
              <input type="radio"
                     name="instrumentCount"
                     [value]="2"
                     [checked]="searchFilters.instrumentCount === 2"
                     (change)="onInstrumentCountChange(2)">
              <span>2 strumenti</span>
            </label>
          </div>
        </div>

        <!-- Instrument Position (for 1 instrument with duration > 30) -->
        <div class="filter-group" *ngIf="showInstrumentPosition && slotSearchEnabled">
          <label class="filter-label">Posizione strumento</label>
          <div class="radio-group vertical">
            <label class="filter-radio">
              <input type="radio"
                     name="instrumentPosition"
                     value="first"
                     [checked]="searchFilters.instrumentPosition === 'first'"
                     (change)="onInstrumentPositionChange('first')">
              <span>{{ getPositionLabel('first') }}</span>
            </label>
            <label class="filter-radio">
              <input type="radio"
                     name="instrumentPosition"
                     value="second"
                     [checked]="searchFilters.instrumentPosition === 'second'"
                     (change)="onInstrumentPositionChange('second')">
              <span>{{ getPositionLabel('second') }}</span>
            </label>
          </div>
        </div>

        <!-- Instrument Order (for 2 instruments) -->
        <div class="filter-group" *ngIf="showInstrumentOrder && slotSearchEnabled">
          <label class="filter-checkbox">
            <input type="checkbox"
                   [checked]="searchFilters.instrumentOrderMatters"
                   (change)="onInstrumentOrderChange($any($event.target).checked)">
            <span>Ordine importante</span>
          </label>
          <p class="filter-hint">Se selezionato, gli strumenti devono essere disponibili in ordine specifico</p>
        </div>

        <!-- Instrument Category (1 strumento) -->
        <div class="filter-group" *ngIf="showInstrumentCategory && slotSearchEnabled">
          <label class="filter-label">Categoria strumento</label>
          <select [value]="searchFilters.instrumentCategoryId || ''"
                  (change)="onInstrumentCategoryChange($any($event.target).value)">
            <option value="">Tutte le categorie</option>
            <option *ngFor="let cat of instrumentCategories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <!-- Two Instrument Categories (2 strumenti) -->
        <div class="filter-group" *ngIf="showTwoInstrumentCategories && slotSearchEnabled">
          <label class="filter-label">Strumento 1 (primi 30 min)</label>
          <select [value]="searchFilters.instrumentCategoryId || ''"
                  (change)="onInstrumentCategoryChange($any($event.target).value)">
            <option value="">Tutte le categorie</option>
            <option *ngFor="let cat of instrumentCategories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="filter-group" *ngIf="showTwoInstrumentCategories && slotSearchEnabled">
          <label class="filter-label">Strumento 2 (secondi 30 min)</label>
          <select [value]="searchFilters.instrument2CategoryId || ''"
                  (change)="onInstrument2CategoryChange($any($event.target).value)">
            <option value="">Tutte le categorie</option>
            <option *ngFor="let cat of instrumentCategories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- PANNELLO 3: TRATTAMENTI IN CORSO -->
    <div class="collapsible-panel">
      <!-- Panel header -->
      <div class="panel-header" (click)="toggleTreatmentsExpanded()">
        <h3 class="panel-title">Trattamenti in corso</h3>
        <svg *ngIf="treatmentsExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <svg *ngIf="!treatmentsExpanded" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Panel content -->
      <div class="panel-content treatments-content" *ngIf="treatmentsExpanded">
        <!-- Placeholder - contenuto da implementare -->
        <div class="empty-state">
          <p>Nessun trattamento in corso</p>
        </div>
      </div>
    </div>
  </div>
</div>
