# Schema source: file locale `backend/src/schema.gql`.
# Vantaggio rispetto a HTTP introspection:
#  - zero dipendenza dal backend in esecuzione per fare codegen
#  - zero auth (TenantContextMiddleware blocca introspection HTTP senza token)
#
# ATTENZIONE — questo file NON si aggiorna da solo. NestJS lo rigenera a ogni
# boot (autoSchemaFile in app.module.ts), ma in container NODE_ENV=production
# lo scrive in /tmp DENTRO il container: effimero, non tocca il repo. Prima
# della containerizzazione il backend girava in locale e il file si aggiornava
# da sé; da allora si è congelato in silenzio, accumulando decine di tipi
# mancanti senza che nessun errore lo segnalasse.
#
# Dopo aver toccato entity, DTO o resolver del backend, allinearlo così:
#   cd backend && npm run schema:sync     # docker cp dal container in esecuzione
#   cd frontend && npm run codegen
schema: '../backend/src/schema.gql'
# Documents in 2 location:
#  - src/app/graphql/**/*.ts (legacy operations)
#  - src/app/features/** /graphql/**/*.ts (operations per-feature, pattern
#    architettura "feature wins": vedi architettura-componenti-ref.md)
#
# Le 4 collisioni Close/ForceClose/Reopen/RecordPayment sono state risolte
# con suffisso `Legacy` sull'operation name (NON sulla const TS) nel file
# legacy `app/graphql/operations/treatment.mutations.ts`. Le const TS dei
# file legacy continuano a funzionare invariate per i loro caller.
documents:
  - './src/app/graphql/**/*.ts'
  - './src/app/features/**/graphql/**/*.ts'
generates:
  ./src/app/graphql/generated/types.ts:  # Dove salvare i tipi
    plugins:
      - 'typescript'
      - 'typescript-operations'
