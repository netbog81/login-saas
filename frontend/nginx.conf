server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # index.html non deve MAI restare in cache.
    #
    # I bundle hanno l'hash nel nome e possono stare in cache per sempre: se
    # cambiano, cambia il nome. index.html invece si chiama sempre uguale ed e'
    # l'unico posto dove quei nomi sono scritti. Senza una direttiva esplicita
    # il browser lo tiene con la propria euristica e continua a chiedere i
    # bundle della versione precedente: l'utente ricarica, non vede le
    # modifiche appena rilasciate, e non c'e' niente che glielo spieghi.
    #
    # Il `try_files` qui sotto fa una redirezione interna a /index.html, che
    # rientra nel match delle location: questo blocco vale quindi anche per
    # tutte le route SPA, non solo per la richiesta diretta del file.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # SPA fallback — tutte le route non-file vanno a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statica
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
